<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>FiberLine</title>
<style type="text/css">
body, html
            {
margin: 0; padding: 0; height: 100%; overflow: hidden;
            }

#content
            {
position:absolute; left: 0; right: 0; bottom: 0; top: 0px; 
            }

#loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #1a1a1d 0%, #2c2c30 50%, #1a1a1d 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.5s ease, visibility 0.5s ease;
}

#loading-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

#loading-logo {
    width: 120px;
    height: 120px;
    object-fit: contain;
    margin-bottom: 32px;
    animation: pulse 1.8s ease-in-out infinite;
    filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.4));
}

@keyframes pulse {
    0%, 100% {
        transform: scale(1);
        opacity: 0.85;
    }
    50% {
        transform: scale(1.06);
        opacity: 1;
    }
}

.spinner {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.12);
    border-top-color: #b5b5ba;
    animation: spin 0.9s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

#loading-text {
    margin-top: 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #9a9aa0;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
}
</style>
</head>
<body>

<div id="loading-overlay">
    <img id="loading-logo" src="https://raw.githack.com/fiberline-games/fiberline/main/assets/images/logo.png" alt="FiberLine" />
    <div class="spinner"></div>
    <div id="loading-text">Loading</div>
</div>

<div id="content">
<iframe width="100%" height="100%" frameborder="0" src="https://raw.githack.com/fiberline-games/fiberline/main/" onload="document.getElementById('loading-overlay').classList.add('hidden')"></iframe>
</div>
</body>
</html>
